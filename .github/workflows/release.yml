name: Release

# One job tags AND publishes. A tag pushed with GITHUB_TOKEN does not start other
# workflows, so a separate "on: push: tags" release workflow would never run.
#
# Gated on Validate: a push to main releases only after the Validate run for that
# push has passed, and the job checks out exactly the commit Validate checked. A
# manual run (workflow_dispatch) needs a passing Validate run on the tag's commit.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish (or re-upload), e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish a version that has no release yet
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # look up Validate runs for a manual release
    steps:
      - uses: actions/checkout@v4
        with:
          # the tag on a manual run; else the commit the passing Validate run checked
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}

      - name: Validate passed on this commit (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$sha&status=success" --jq '.total_count')"
          if [ "$passed" -lt 1 ]; then
            echo "::error::no passing Validate run on $sha; run Validate on it first" >&2
            exit 1
          fi

      - name: Decide what to release
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        # Releases whenever tag v<version> is not on origin yet, however the
        # change reached main. Dry-run tested in .github/scripts/test-release-plan.sh.
        run: .github/scripts/release-plan.sh "$INPUT_TAG"

      - name: Push the tag
        if: steps.plan.outputs.push_tag == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "unsupervised $TAG"
          git push origin "$TAG"

      - name: Build the skill tarball and notes
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          .github/scripts/build-release.sh --tag "$TAG" --out dist
          tar -tzf "dist/unsupervised-$TAG.tar.gz"
          cat dist/release-notes.md

      - name: Publish the GitHub release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          asset="dist/unsupervised-$TAG.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --verify-tag \
              --title "unsupervised $TAG" --notes-file dist/release-notes.md
          fi
