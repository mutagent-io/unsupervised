name: Release

# One job tags AND publishes. A tag pushed with GITHUB_TOKEN does not start other
# workflows, so a separate "on: push: tags" release workflow would never run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish (or re-upload), e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish a version that has no release yet
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}   # empty on push: the pushed commit

      - name: Decide what to release
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        # Releases whenever tag v<version> is not on origin yet, however the
        # change reached main. Dry-run tested in .github/scripts/test-release-plan.sh.
        run: .github/scripts/release-plan.sh "$INPUT_TAG"

      - name: Push the tag
        if: steps.plan.outputs.push_tag == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "unsupervised $TAG"
          git push origin "$TAG"

      - name: Build the skill tarball and notes
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          .github/scripts/build-release.sh --tag "$TAG" --out dist
          tar -tzf "dist/unsupervised-$TAG.tar.gz"
          cat dist/release-notes.md

      - name: Publish the GitHub release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          asset="dist/unsupervised-$TAG.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --verify-tag \
              --title "unsupervised $TAG" --notes-file dist/release-notes.md
          fi
